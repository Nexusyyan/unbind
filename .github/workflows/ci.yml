name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pure ASCII source files
        run: |
          $nonAscii = @()
          Get-ChildItem -Recurse -File -Include *.rs,*.ts,*.tsx | Where-Object {
            $_.FullName -notmatch '\\(target|node_modules|dist|\.git)\\'
          } | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($bytes | Where-Object { $_ -gt 127 }) {
              $nonAscii += $_.FullName
            }
          }
          if ($nonAscii.Count -gt 0) {
            Write-Error ("Non-ASCII characters found in: " + ($nonAscii -join ", "))
            exit 1
          }
          Write-Host "OK: all *.rs, *.ts, *.tsx source files are pure ASCII"

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Rust Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
